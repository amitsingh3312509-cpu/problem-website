<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SIH Problem Idea Form</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f1f3f4;
  color:#202124;
}

/* Header */
.header{
  background:#673ab7;
  color:white;
  padding:22px 18px;
}

.header h1{
  font-size:25px;
}

.header p{
  margin-top:7px;
  font-size:14px;
}

/* Main */
.container{
  max-width:720px;
  margin:25px auto;
  padding:0 12px;
}

/* Title */
.title-card{
  background:white;
  border-radius:8px;
  border-top:9px solid #673ab7;
  padding:25px;
  margin-bottom:16px;
  box-shadow:0 1px 4px #ccc;
}

.title-card h2{
  font-size:27px;
  margin-bottom:12px;
}

.title-card p{
  color:#5f6368;
  line-height:1.6;
}

.required{
  color:#d93025;
}

/* Form Card */
.card{
  background:white;
  border-radius:8px;
  padding:23px;
  margin-bottom:16px;
  box-shadow:0 1px 4px #ddd;
}

.card label{
  display:block;
  font-size:16px;
  font-weight:500;
  margin-bottom:12px;
}

input,
select,
textarea{
  width:100%;
  border:none;
  border-bottom:1px solid #aaa;
  padding:12px 4px;
  font-size:16px;
  outline:none;
  background:white;
}

input:focus,
select:focus,
textarea:focus{
  border-bottom:2px solid #673ab7;
}

textarea{
  min-height:110px;
  resize:vertical;
}

/* Yes No */
.options{
  display:flex;
  gap:35px;
  margin-top:10px;
}

.option{
  display:flex;
  align-items:center;
  gap:9px;
  font-weight:normal !important;
}

.option input{
  width:18px;
  height:18px;
  accent-color:#673ab7;
}

/* Submit */
.bottom{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:22px 0 40px;
}

.clear{
  border:none;
  background:none;
  color:#673ab7;
  font-weight:bold;
  font-size:15px;
  cursor:pointer;
}

.submit{
  border:none;
  background:#673ab7;
  color:white;
  padding:13px 28px;
  border-radius:5px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.submit:hover{
  background:#512da8;
}

footer{
  text-align:center;
  color:#777;
  font-size:13px;
  padding-bottom:30px;
}

/* Mobile */
@media(max-width:600px){

  .header h1{
    font-size:21px;
  }

  .title-card h2{
    font-size:23px;
  }

  .title-card,
  .card{
    padding:20px;
  }

  .options{
    gap:22px;
  }
}
</style>
</head>

<body>

<div class="header">
  <h1>Smart India Hackathon</h1>
  <p>Problem Idea Selection & Student Response Form</p>
</div>

<div class="container">

  <div class="title-card">

    <h2>SIH Problem Idea Form</h2>

    <p>
      Please fill in your details and select whether
      you want to work on the proposed problem statement.
    </p>

    <br>

    <p>
      <span class="required">*</span>
      Required question
    </p>

  </div>


  <form
    action="https://formsubmit.co/amitsingh3312509@gmail.com"
    method="POST"
  >

    <!-- FormSubmit settings -->

    <input
      type="hidden"
      name="_subject"
      value="SIH Problem Idea Response"
    >

    <input
      type="hidden"
      name="_captcha"
      value="false"
    >

    <input
      type="hidden"
      name="_template"
      value="table"
    >

    <input
      type="hidden"
      name="_next"
      value="https://YOUR-USERNAME.github.io/thankyou.html"
    >


    <!-- NAME -->

    <div class="card">

      <label>
        Student Name <span class="required">*</span>
      </label>

      <input
        type="text"
        name="Student Name"
        placeholder="Enter your full name"
        required
      >

    </div>


    <!-- BRANCH -->

    <div class="card">

      <label>
        Branch <span class="required">*</span>
      </label>

      <select
        name="Branch"
        required
      >

        <option value="">
          Select your branch
        </option>

        <option value="Computer Science and Engineering">
          Computer Science and Engineering (CSE)
        </option>

        <option value="Information Technology">
          Information Technology (IT)
        </option>

        <option value="Electronics and Communication">
          Electronics & Communication (ECE)
        </option>

        <option value="Electrical Engineering">
          Electrical Engineering (EE)
        </option>

        <option value="Mechanical Engineering">
          Mechanical Engineering (ME)
        </option>

        <option value="Civil Engineering">
          Civil Engineering (CE)
        </option>

        <option value="Other">
          Other
        </option>

      </select>

    </div>


    <!-- ROLL NUMBER -->

    <div class="card">

      <label>
        Roll Number <span class="required">*</span>
      </label>

      <input
        type="text"
        name="Roll Number"
        placeholder="Enter your roll number"
        required
      >

    </div>


    <!-- PROBLEM IDEA NAME -->

    <div class="card">

      <label>
        Problem Idea Name <span class="required">*</span>
      </label>

      <input
        type="text"
        name="Problem Idea Name"
        placeholder="Example: LandGuard AI"
        required
      >

    </div>


    <!-- PROBLEM CODE -->

    <div class="card">

      <label>
        Problem Statement Code <span class="required">*</span>
      </label>

      <input
        type="text"
        name="Problem Statement Code"
        placeholder="Example: SIH26017"
        required
      >

    </div>


    <!-- PROBLEM STATEMENT -->

    <div class="card">

      <label>
        Problem Statement / Idea
        <span class="required">*</span>
      </label>

      <textarea
        name="Problem Statement"
        placeholder="Write the problem statement or your idea..."
        required
      ></textarea>

    </div>


    <!-- REASON -->

    <div class="card">

      <label>
        Why do you want to work on this problem?
        <span class="required">*</span>
      </label>

      <textarea
        name="Reason"
        placeholder="Write your reason..."
        required
      ></textarea>

    </div>


    <!-- YES NO -->

    <div class="card">

      <label>
        Do you want to work on this problem?
        <span class="required">*</span>
      </label>

      <div class="options">

        <label class="option">
          <input
            type="radio"
            name="Want To Work"
            value="Yes"
            required
          >
          Yes
        </label>

        <label class="option">
          <input
            type="radio"
            name="Want To Work"
            value="No"
          >
          No
        </label>

      </div>

    </div>


    <!-- DATE -->

    <div class="card">

      <label>
        Date <span class="required">*</span>
      </label>

      <input
        type="date"
        name="Date"
        id="date"
        required
      >

    </div>


    <!-- TIME -->

    <div class="card">

      <label>
        Time <span class="required">*</span>
      </label>

      <input
        type="time"
        name="Time"
        id="time"
        required
      >

    </div>


    <!-- DAY -->

    <div class="card">

      <label>
        Day <span class="required">*</span>
      </label>

      <select
        name="Day"
        id="day"
        required
      >

        <option value="">
          Select day
        </option>

        <option>Monday</option>
        <option>Tuesday</option>
        <option>Wednesday</option>
        <option>Thursday</option>
        <option>Friday</option>
        <option>Saturday</option>
        <option>Sunday</option>

      </select>

    </div>


    <!-- BUTTON -->

    <div class="bottom">

      <button
        type="reset"
        class="clear"
      >
        Clear form
      </button>

      <button
        type="submit"
        class="submit"
      >
        Submit
      </button>

    </div>

  </form>


  <footer>
    Smart India Hackathon • Student Problem Selection Form
  </footer>

</div>


<script>

/* Automatically set today's date */
const dateInput = document.getElementById("date");
const timeInput = document.getElementById("time");
const dayInput = document.getElementById("day");

const now = new Date();

const year = now.getFullYear();
const month = String(now.getMonth()+1).padStart(2,"0");
const date = String(now.getDate()).padStart(2,"0");

dateInput.value = `${year}-${month}-${date}`;


/* Automatically set current time */

const hours = String(now.getHours()).padStart(2,"0");
const minutes = String(now.getMinutes()).padStart(2,"0");

timeInput.value = `${hours}:${minutes}`;


/* Automatically select current day */

const days = [
  "Sunday",
  "Monday",
  "Tuesday",
  "Wednesday",
  "Thursday",
  "Friday",
  "Saturday"
];

dayInput.value = days[now.getDay()];

</script>

</body>
</html>
